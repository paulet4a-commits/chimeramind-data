name: Growth v2 quality and controlled Pages deploy

on:
  pull_request:
  push:
    branches: [main, growth-v2-2026-10-07]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:secrets
      - run: npm run check:data
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - run: npm run smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: growth-v2-preview-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 14

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    concurrency:
      group: chimeramind-data-gh-pages
      cancel-in-progress: false
    steps:
      - name: Block deploy if Apify secret is missing
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo '::error::APIFY_TOKEN secret is missing. Live fetch, publication and IndexNow are blocked.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read-only live data fetch
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: npm run fetch
      - run: npm run check:data -- --release
      - run: npm run check:secrets
      - run: npm test
      - run: npm run build:release
      - run: npm run check:dist
      - run: npm run smoke
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/indexnow-state.json
          key: indexnow-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v2-
      - name: Publish gh-pages and request Pages build
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: npm run deploy
      - name: Verify published build, URLs and sitemap
        run: npm run verify:live
      - name: Notify IndexNow only after live smoke succeeds
        run: npm run indexnow
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/indexnow-state.json
          key: indexnow-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save deployment artifact and rollback receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: growth-v2-release-${{ github.run_id }}
          path: |
            dist/
            data/deploy-receipt.json
            data/fetch-meta.json
            data/previous-build-manifest.json
            data/indexnow-state.json
          include-hidden-files: true
          retention-days: 30
